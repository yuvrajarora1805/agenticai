version: '3.8'

services:
  waresync-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waresync-ai-system
    restart: unless-stopped
    ports:
      # Host port is configurable via PORT env var, defaults to 8000 (or change to 3010, 8080, etc. on shared servers)
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - PORT=8000
    volumes:
      # Persist generated PDF invoices, delivery challans and policies across container restarts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
